name: Deploy game to GitHub Pages

on:
  workflow_run:
    workflows: [游戏体检]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 确认已体检提交仍是 main 最新提交
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" = "$CHECKED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.target.outputs.current == 'true'
        with:
          name: checked-game-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: checked-dist
      - name: Verify game entry points
        if: steps.target.outputs.current == 'true'
        run: |
          test -s checked-dist/index.html
          test -s checked-dist/survival.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.current == 'true'
        with:
          path: checked-dist
      - uses: actions/deploy-pages@v4
        if: steps.target.outputs.current == 'true'
        id: deployment
