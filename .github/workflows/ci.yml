name: Game Health Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Static checks, regression tests, and production smoke tests
    # Ubuntu 24.04 supports the Chromium dependencies for Playwright 1.58.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Run the full health check
        id: health
        run: bash tools/ci-check.sh
      - name: Report runner setup failures
        if: failure() && steps.health.outcome == 'skipped'
        run: |
          printf '# Game Health Check\n\n- ❌ Runner setup failed before the health check started. Expand the failed setup step in this job.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser failure artifacts
        if: failure() && steps.health.outputs.browser_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            .cache/ci-playwright/
            .cache/ci-logs/browser*.log
          include-hidden-files: true
          if-no-files-found: error
      - name: Save the verified production build
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: checked-game-${{ github.sha }}-${{ github.run_attempt }}
          path: src/frontend/dist/
          if-no-files-found: error
          retention-days: 3
