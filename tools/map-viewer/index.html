<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#16221f" /><link rel="icon" href="data:," />
  <title>Emberwood Map and Balance Console</title><link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="mast">
    <div class="identity"><span class="ember" aria-hidden="true">◈</span><div><strong>Emberwood</strong><small>Map and Balance Console</small></div></div>
    <div class="mast-actions">
      <div class="cluster"><button id="btnUndo" disabled>Undo 0</button><button id="btnRedo" disabled>Redo 0</button></div>
      <div class="cluster"><button id="btnPresetOut">Export preset</button><button id="btnPresetIn">Import preset</button></div>
      <button id="btnReview">Review diff and save <b id="changeCount" hidden>0</b></button><button id="btnCheck" class="primary">Save and check balance</button>
      <input id="presetFile" type="file" accept=".json,application/json" hidden />
    </div>
  </header>
  <div class="workspace">
    <main>
      <div class="map-nav"><div class="modes"><button data-mode="adventure" class="active">Adventure</button><button data-mode="survival">Survival</button><button data-mode="eternal">Eternal</button></div><div id="seedBox" hidden><input id="seedInput" aria-label="Survival seed" value="20261125" /><button id="btnRndSeed">Random</button><button id="btnGenSeed">Generate</button></div><button id="btnExport">Export panorama PNG</button></div>
      <div class="viewport"><div class="map-caption"><h1 id="mapTitle">Adventure Mode</h1><span id="mapMeta"></span></div><canvas id="mapCanvas" aria-label="World map"></canvas>
        <div class="camera"><button id="btnZoomOut" aria-label="Zoom out">−</button><output id="zoomLabel">100%</output><button id="btnZoomIn" aria-label="Zoom in">+</button><button id="btnFit">Fit map</button><button id="btnReset">Reset view</button></div>
      </div>
      <div class="map-key"><span><i class="ice"></i>Enemy preview</span><label><input id="leash" type="checkbox" checked />Leash range</label><span><i class="fire"></i>Attack range</span><div class="camp"><span>Campfire</span><button data-camp="1" class="active">Lv.1</button><button data-camp="2">Lv.2</button><button data-camp="3">Lv.3</button></div></div>
    </main>
    <aside><nav role="tablist" aria-label="Console panel"><button role="tab" data-tab="map">Map Editing</button><button role="tab" data-tab="rules">Spawn Rules</button><button role="tab" data-tab="enemy">Enemy Tuning</button><button role="tab" data-tab="hero">Hero Tuning</button></nav>
      <section class="inspector"><div id="validation" role="alert" hidden></div><div id="panelBody"></div>
        <div id="mapLayers"><details open><summary>Map layers</summary><div class="layer-grid">
          <label><input data-layer="regions" type="checkbox" checked />Regional boundaries</label><label><input data-layer="lights" type="checkbox" checked />Campfire light radius</label>
          <label><input data-layer="resources" type="checkbox" checked />Materials and facilities</label><label><input data-layer="spawns" type="checkbox" checked />Enemies and spawn points</label>
          <label><input data-layer="collision" type="checkbox" />Blocked tiles</label><label><input data-layer="grid" type="checkbox" />Grid lines</label>
        </div></details><details><summary>Terrain and marker legend</summary><div id="legendList"></div></details></div>
      </section>
    </aside>
  </div>
  <footer><span id="diskState">Connecting to the local server…</span><span id="statusCoords">tiles (—, —)</span><span id="statusRegion"></span><span id="statusTerrain"></span><span id="statusSolid"></span><span id="statusItem"></span></footer>
  <dialog id="review"><h2 id="reviewTitle"></h2><div id="reviewBody"></div><div id="reviewFoot"></div></dialog>
  <script type="module" src="./main.ts"></script>
</body></html>
